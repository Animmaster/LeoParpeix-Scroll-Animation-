<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeoParpeix Scroll Animation </title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <section class="intro">
      <h1>Everything here took longer than expected.</h1>
    </section>

    <section class="spotlight">
      <div class="spotlight-item">
        <img src="/img1.jpg" alt="" />
        <div class="spotlight-item-copy">
          <p>Fruiting Bodies</p>
          <p>01</p>
        </div>
      </div>

      <div class="spotlight-item">
        <img src="/img2.jpg" alt="" />
        <div class="spotlight-item-copy">
          <p>Silk &amp; Sediment</p>
          <p>02</p>
        </div>
      </div>

      <div class="spotlight-item">
        <img src="/img3.jpg" alt="" />
        <div class="spotlight-item-copy">
          <p>Canvas Drape</p>
          <p>03</p>
        </div>
      </div>

      <div class="spotlight-item">
        <img src="/img4.jpg" alt="" />
        <div class="spotlight-item-copy">
          <p>Lowland Drift</p>
          <p>04</p>
        </div>
      </div>

      <div class="spotlight-item">
        <img src="/img5.jpg" alt="" />
        <div class="spotlight-item-copy">
          <p>Culture Dish</p>
          <p>05</p>
        </div>
      </div>

      <div class="spotlight-item">
        <img src="/img6.jpg" alt="" />
        <div class="spotlight-item-copy">
          <p>Quiet Hours</p>
          <p>06</p>
        </div>
      </div>
    </section>

    <section class="outro">
      <h1>Thanks for scrolling all the way down here.</h1>
    </section>

    <div class="lottie-container">
      <div class="bee-shadow"></div>
      <div class="bee"></div>
    </div>
    <script type="module" src="/script.js"></script>
  </body>
</html>
